name: Rebuild public network

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'build_public_network.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild red-publica.json and red-publica.html
        run: python3 build_public_network.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add red-publica.json red-publica.html
          if git diff --cached --quiet; then
            echo "No changes to red-publica.json/html"
          else
            git commit -m "Auto-rebuild red-publica.json/html from index.html"
            git push
          fi
